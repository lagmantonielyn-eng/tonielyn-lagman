<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tonie Lagman — Virtual Assistant & Marketing Professional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --beige:#f5ede0;
  --beige-dark:#e8d9c4;
  --beige-deeper:#d4c0a3;
  --brown:#8b6f52;
  --brown-dark:#5c4535;
  --ink:#2a2017;
  --ink-soft:#7a6a58;
  --cream:#faf6f0;
  --white:#ffffff;
  --border:rgba(139,111,82,0.2);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);line-height:1.7;overflow-x:hidden}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:1rem 5%;
  background:rgba(250,246,240,0.95);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  z-index:100;
}
.nav-logo{display:flex;align-items:center;gap:0.75rem;text-decoration:none}
.nav-logo img{width:36px;height:36px;object-fit:contain}
.nav-logo-text{font-family:var(--serif);font-size:1.1rem;font-weight:600;color:var(--ink);letter-spacing:0.08em;text-transform:uppercase}
.nav-logo-text span{color:var(--brown);font-weight:300}
.nav-links{display:flex;gap:2rem;list-style:none}
.nav-links a{text-decoration:none;color:var(--ink-soft);font-size:0.75rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;transition:color 0.2s}
.nav-links a:hover{color:var(--brown)}

/* HERO */
.hero{
  background:var(--beige);
  padding:7rem 5% 5rem;
  display:flex;flex-direction:column;align-items:center;
  text-align:center;
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:radial-gradient(ellipse at 60% 0%,rgba(139,111,82,0.08) 0%,transparent 70%);
  pointer-events:none;
}
.hero-logo{width:90px;height:90px;object-fit:contain;margin-bottom:1.5rem;filter:drop-shadow(0 4px 12px rgba(92,69,53,0.15))}
.hero-name{
  font-family:var(--serif);
  font-size:clamp(2.4rem,6vw,4.5rem);
  font-weight:300;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--ink);
  line-height:1;
  margin-bottom:0.5rem;
}
.hero-name strong{font-weight:600;color:var(--brown-dark)}
.hero-title{
  font-size:0.85rem;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--brown);font-weight:500;margin-bottom:0.5rem;
}
.hero-sub{font-size:0.85rem;color:var(--ink-soft);font-weight:300;font-style:italic;margin-bottom:2.5rem}
.hero-divider{width:60px;height:1px;background:var(--brown);margin:0 auto 2.5rem}
.hero-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn-primary{
  background:var(--brown-dark);color:var(--cream);
  padding:0.85rem 2.2rem;text-decoration:none;
  font-size:0.75rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;
  border-radius:2px;transition:background 0.2s,transform 0.15s;
}
.btn-primary:hover{background:var(--brown);transform:translateY(-2px)}
.btn-outline{
  border:1px solid var(--brown);color:var(--brown-dark);
  padding:0.85rem 2.2rem;text-decoration:none;
  font-size:0.75rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;
  border-radius:2px;transition:all 0.2s;
}
.btn-outline:hover{background:var(--brown);color:var(--cream)}

/* SECTION WRAPPER */
.section{padding:5rem 5%;max-width:1100px;margin:0 auto}
.section-full{padding:5rem 5%}
.section-inner{max-width:1100px;margin:0 auto}

/* SECTION HEADER */
.section-head{text-align:center;margin-bottom:3.5rem}
.section-head h2{
  font-family:var(--serif);font-size:clamp(1.6rem,3vw,2.4rem);
  font-weight:400;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink);
  margin-bottom:0.5rem;
}
.section-head .divider{
  width:40px;height:2px;background:var(--brown);
  margin:0.75rem auto 0;
}

/* ABOUT + TOOLS */
.about-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:4rem;align-items:start}
.about-label{
  font-size:0.7rem;letter-spacing:0.15em;text-transform:uppercase;
  color:var(--brown);font-weight:500;margin-bottom:1rem;
  display:flex;align-items:center;gap:0.6rem;
}
.about-label::before{content:'◆';font-size:0.45rem}
.about-text{font-size:0.93rem;color:var(--ink-soft);line-height:1.9;font-weight:300}

/* TOOLS */
.tools-label{
  font-family:var(--serif);font-size:1.3rem;font-weight:400;
  letter-spacing:0.08em;color:var(--ink);margin-bottom:1.5rem;
  text-align:center;
}
.tools-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.tool-item{
  background:var(--beige);border:1px solid var(--border);border-radius:4px;
  padding:0.9rem 0.75rem;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:0.4rem;
  transition:background 0.2s,transform 0.15s;
}
.tool-item:hover{background:var(--beige-dark);transform:translateY(-2px)}
.tool-item span{font-size:0.72rem;font-weight:500;letter-spacing:0.06em;color:var(--ink-soft);text-transform:uppercase}
.tool-icon{font-size:1.4rem}

/* SOCIAL ROW */
.social-row{display:flex;gap:0.75rem;justify-content:center;margin-top:1.5rem;flex-wrap:wrap}
.social-chip{
  background:var(--beige);border:1px solid var(--border);
  color:var(--ink-soft);padding:0.45rem 1rem;border-radius:2px;
  font-size:0.72rem;letter-spacing:0.08em;text-transform:uppercase;font-weight:500;
  text-decoration:none;transition:background 0.2s,color 0.2s;
}
.social-chip:hover{background:var(--brown);color:var(--cream)}

/* EXPERIENCE */
.exp-bg{background:var(--beige)}
.exp-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 3rem}
.exp-item{padding:1.5rem 0;border-bottom:1px solid var(--border);position:relative;padding-left:1.25rem}
.exp-item::before{
  content:'◆';position:absolute;left:0;top:1.75rem;
  font-size:0.45rem;color:var(--brown);line-height:1;
}
.exp-company{font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--brown);font-weight:600;margin-bottom:0.15rem}
.exp-title{font-family:var(--serif);font-size:1.05rem;font-weight:600;color:var(--ink);margin-bottom:0.6rem;line-height:1.3}
.exp-bullets{list-style:none;padding:0}
.exp-bullets li{
  font-size:0.82rem;color:var(--ink-soft);line-height:1.65;
  padding-left:1rem;position:relative;margin-bottom:0.25rem;
}
.exp-bullets li::before{content:'•';position:absolute;left:0;color:var(--brown)}
.exp-badge{
  display:inline-block;font-size:0.68rem;letter-spacing:0.06em;
  background:var(--brown);color:var(--cream);
  padding:0.2rem 0.65rem;border-radius:2px;margin-top:0.5rem;font-weight:500;
}

/* CERTIFICATIONS */
.certs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.5rem}
.cert-card{
  background:var(--beige);border:1px solid var(--border);border-radius:4px;
  padding:1.75rem 1.5rem;text-align:center;
  transition:transform 0.2s,box-shadow 0.2s;
  position:relative;
}
.cert-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(92,69,53,0.12)}
.cert-card::before{
  content:'◆';display:block;color:var(--brown);
  font-size:0.6rem;margin-bottom:0.75rem;
}
.cert-org{font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--brown);font-weight:600;margin-bottom:0.5rem}
.cert-card h3{font-family:var(--serif);font-size:1rem;font-weight:600;color:var(--ink);margin-bottom:0.35rem;line-height:1.3}
.cert-date{font-size:0.75rem;color:var(--ink-soft)}
.cert-award{
  display:inline-block;font-size:0.7rem;font-weight:500;
  color:var(--brown-dark);background:var(--beige-dark);
  padding:0.2rem 0.6rem;border-radius:2px;margin-top:0.75rem;
}

/* EDUCATION */
.edu-timeline{display:flex;gap:0;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:2rem}
.edu-item{
  background:var(--beige);border:1px solid var(--border);border-radius:50px;
  padding:1.1rem 1.75rem;text-align:center;min-width:200px;
  transition:background 0.2s;
}
.edu-item:hover{background:var(--beige-dark)}
.edu-year{font-size:0.7rem;letter-spacing:0.1em;color:var(--brown);font-weight:600;margin-bottom:0.3rem}
.edu-school{font-family:var(--serif);font-size:0.95rem;font-weight:600;color:var(--ink);line-height:1.3}
.edu-arrow{font-size:1.2rem;color:var(--brown);padding:0 0.5rem;align-self:center}

/* BRANDS */
.brands-bg{background:var(--beige-dark)}
.brands-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:1rem;margin-top:2rem}
.brand-item{
  background:var(--cream);border:1px solid var(--border);
  padding:0.6rem 1.25rem;border-radius:2px;
  font-size:0.78rem;font-weight:500;letter-spacing:0.06em;color:var(--ink-soft);
  transition:background 0.2s,color 0.2s;
}
.brand-item:hover{background:var(--brown);color:var(--cream)}

/* CONTACT */
.contact-bg{background:var(--brown-dark)}
.contact-inner{max-width:800px;margin:0 auto;text-align:center;padding:5rem 5%}
.contact-inner h2{
  font-family:var(--serif);font-size:clamp(2rem,4vw,3rem);
  font-weight:400;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--cream);margin-bottom:0.5rem;
}
.contact-inner p{color:rgba(250,246,240,0.7);font-weight:300;margin-bottom:2.5rem;font-size:0.95rem}
.contact-links{display:flex;justify-content:center;gap:1.5rem;flex-wrap:wrap;margin-bottom:2rem}
.contact-link{
  display:flex;align-items:center;gap:0.6rem;
  color:var(--cream);text-decoration:none;
  font-size:0.85rem;font-weight:300;
  border-bottom:1px solid rgba(250,246,240,0.3);
  padding-bottom:0.1rem;transition:border-color 0.2s;
}
.contact-link:hover{border-color:var(--cream)}
.contact-divider{color:rgba(250,246,240,0.3)}

/* FOOTER */
footer{
  background:var(--ink);
  padding:1.5rem 5%;
  display:flex;justify-content:space-between;align-items:center;
  font-size:0.72rem;color:rgba(250,246,240,0.4);flex-wrap:wrap;gap:0.5rem;
}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.hero-logo{animation:fadeUp 0.5s ease both}
.hero-name{animation:fadeUp 0.5s 0.1s ease both}
.hero-title{animation:fadeUp 0.5s 0.15s ease both}
.hero-sub{animation:fadeUp 0.5s 0.2s ease both}
.hero-actions{animation:fadeUp 0.5s 0.25s ease both}

@media(max-width:768px){
  .nav-links{display:none}
  .about-grid{grid-template-columns:1fr}
  .exp-grid{grid-template-columns:1fr}
  .edu-timeline{flex-direction:column;align-items:center}
  .edu-arrow{transform:rotate(90deg)}
  .contact-links{flex-direction:column;align-items:center}
  .contact-divider{display:none}
}
</style>
</head>
